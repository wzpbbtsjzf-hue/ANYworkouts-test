<html lang="en">
<head>

<title>Andrea's Workout Tracker</title>
<style>
:root{--bg:#f5f4f7;--card:#ffffff;--ink:#27334a;--muted:#7b7f8c;--line:#e3e3e9;--accent:#7183ad;--accent2:#b5bfd6;--soft:#eef0f6;--hot:#7b8fba;--hot2:#b2bdd3;--green:#718b83;--rose:#b28b9e;--lavender:#9a91b5;--shadow:0 2px 12px rgba(39,51,74,.055)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:90px}.top{position:sticky;top:0;z-index:10;background:rgba(245,244,247,.94);backdrop-filter:blur(14px);padding:16px 16px 12px}.top h1{margin:0;font-size:24px;letter-spacing:-.3px}.top p{margin:4px 0 0;color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:0 16px 12px}.tab{background:#fff;border:1px solid var(--line);padding:11px 8px;border-radius:13px;color:var(--muted);font-weight:700}.tab.active{background:#53627f;color:#fff;border-color:#53627f}.screen{padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--shadow)}.hero{padding:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.small{font-size:12px;color:var(--muted)}.tiny{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}.muted{color:var(--muted)}.pill{display:inline-flex;align-items:center;background:#eef0f6;border-radius:999px;padding:6px 10px;font-size:12px;color:#596b92;font-weight:700}.workout-title{font-size:21px;font-weight:800;letter-spacing:-.25px;color:#2f3c55}.section-title{font-size:17px;font-weight:800;margin:21px 2px 9px;color:#39465f}.exercise{padding:15px}.exercise h3{margin:0 0 5px;font-size:16px}.prev{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:#5d7098;margin:10px 0;padding:8px 10px;background:#f1f2f7;border-radius:10px}.prev .arrow{font-size:14px}.fields{display:grid;grid-template-columns:1.15fr 1fr .8fr;gap:8px}.fields label{font-size:11px;color:var(--muted);font-weight:600}.fields input{width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.primary{background:#53627f;color:#fff;border-radius:11px;padding:10px 14px;font-weight:750}.secondary{background:#eef0f6;color:#53627f;border-radius:11px;padding:10px 12px;font-weight:700}.danger{color:#a33;background:#fff;border:1px solid #efcccc}.timer{position:fixed;right:14px;left:14px;bottom:14px;z-index:30;background:#53627f;color:#fff;border-radius:17px;padding:12px 14px;box-shadow:0 10px 28px rgba(0,0,0,.24);display:none}.timer .timerInner{display:flex;align-items:center;justify-content:space-between}.timer strong{font-size:24px}.timer button{background:#fff;color:#53627f;border-radius:9px;padding:6px 9px;margin-left:8px}.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:var(--soft);padding:13px;border-radius:13px}.stat .label{font-size:11px;color:var(--muted);font-weight:650}.stat b{display:block;font-size:22px;margin-top:3px}.barrow{display:grid;grid-template-columns:88px 1fr 30px;align-items:center;gap:8px;margin:11px 0;font-size:12px}.bar{height:9px;background:#e9ebef;border-radius:99px;overflow:hidden}.fill{height:100%;background:#7183ad;border-radius:99px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:9px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#e7e9ed}.dot.low{background:#c8d0df}.dot.med{background:#aeb9d1}.dot.high{background:#7183ad}.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{height:43px;border-radius:8px;background:#eef0f3;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:var(--muted);gap:2px}.day.worked1{background:#d5dbe6;color:#52617f}.day.worked2{background:#b2bdd3;color:#fff}.day.worked3{background:#7183ad;color:#fff}.week-labels{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:9px;color:var(--muted);text-align:center;margin-bottom:5px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:9px 4px;border-bottom:1px solid var(--line)}.table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.empty{text-align:center;color:var(--muted);padding:28px 10px}.footer-note{font-size:12px;color:var(--muted);line-height:1.45}.bodymap{position:relative;height:290px;background:linear-gradient(180deg,#fbfafd,#f4f4f8);border-radius:16px;overflow:hidden}.bodymap svg{position:absolute;inset:0;width:100%;height:100%}.body-label{position:absolute;background:#fff;border:1px solid var(--line);border-radius:9px;padding:5px 8px;font-size:10px;box-shadow:0 2px 6px rgba(0,0,0,.05)}.bl-shoulder{top:52px;left:9%}.bl-chest{top:92px;left:5%}.bl-back{top:108px;right:7%}.bl-arms{top:142px;left:7%}.bl-core{top:145px;right:8%}.bl-glute{bottom:70px;left:6%}.bl-ham{bottom:28px;right:6%}.bl-quad{bottom:29px;left:8%}.body-legend{display:flex;justify-content:center;gap:10px;margin-top:8px;font-size:10px;color:var(--muted)}.month-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.month-title{font-weight:800}.report-list{display:grid;gap:8px}.report-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.report-row:last-child{border-bottom:0}.mini-bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end;height:100px;margin-top:12px}.mini-bar{display:flex;flex-direction:column;align-items:center;justify-content:end;gap:5px;font-size:9px;color:var(--muted)}.mini-bar i{display:block;width:100%;max-width:35px;background:#8b88a8;border-radius:6px 6px 2px 2px;min-height:4px}.pr-badge{background:#f0eef5;border-radius:9px;padding:5px 7px;font-size:11px;font-weight:750;color:#665d83}.settings-line{padding:10px 0;border-bottom:1px solid var(--line)}.settings-line:last-child{border-bottom:0}.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.timer-note{font-size:10px;opacity:.82;margin-top:3px}.timer.done{background:#667f78}.backup-label{font-size:11px;color:var(--muted);line-height:1.4}
@media(max-width:480px){.fields{grid-template-columns:1fr 1fr}.fields label:last-child{grid-column:1/-1}.fields label:last-child input{max-width:150px}.bodymap{height:275px}}
</style></head>
<body>
<div class="app">
<header class="top"><h1>Andrea's Workout Tracker</h1><p>Strength • progression • recovery</p></header>
<nav class="tabs"><button class="tab active" data-tab="workout">Workout</button><button class="tab" data-tab="stats">Statistics</button><button class="tab" data-tab="history">History</button></nav>
<main id="main" class="screen"></main></div>
<div id="timer" class="timer"><div class="timerInner"><div><span>Rest <strong id="time">90</strong>s</span><div id="timerNote" class="timer-note">Timer keeps its place if you switch screens.</div></div><button onclick="stopTimer()">×</button></div></div>
<script>
const workouts={
 A:{name:'Full Body A',ex:[['Goblet squat to comfortable depth',3,'8–10',90,2.5,['Quads','Glutes','Core']],['DB Romanian deadlift',3,'8–10',90,2,['Hamstrings','Glutes','Back']],['DB bench press',3,'8–12',75,2,['Chest','Triceps','Shoulders']],['1-arm DB row / side',3,'10–12',60,2,['Back','Biceps']],['Hip thrust',3,'10–12',75,2,['Glutes','Hamstrings']],['Dead bug / side',2,'8–10',45,3,['Core']] ]},
 B:{name:'Full Body B',ex:[['DB Romanian deadlift',3,'8–10',90,2,['Hamstrings','Glutes','Back']],['Low step-up / side',2,'8–10',60,2.5,['Glutes','Quads']],['DB shoulder press',3,'8–12',75,2,['Shoulders','Triceps']],['Chest-supported DB row',3,'10–12',75,2,['Back','Biceps']],['Glute bridge, 2-sec squeeze',2,'12–15',60,2,['Glutes','Hamstrings']],['Lateral raise',2,'12–15',45,2,['Shoulders']],['Side plank / side',2,'20–30 sec',45,3,['Core']] ]},
 C:{name:'Full Body C',ex:[['Squat variation',3,'8–12',90,2,['Quads','Glutes']],['Single-leg RDL / side',2,'8–10',60,2,['Hamstrings','Glutes','Core']],['Incline DB press',3,'8–12',75,2,['Chest','Shoulders','Triceps']],['Lat pulldown / band pulldown',3,'10–12',75,2,['Back','Biceps']],['Hip thrust',2,'10–15',75,1.5,['Glutes','Hamstrings']],['DB curl',2,'10–15',45,1.5,['Biceps']],['Triceps extension',2,'10–15',45,1.5,['Triceps']],['Pallof press / side',2,'10–12',45,3,['Core']] ]}
};
const key='andreaWorkoutLogTESTV1'; const timerKey='andreaWorkoutTimerTESTV1'; let data=JSON.parse(localStorage.getItem(key)||'{"logs":[],"week":1,"day":"A"}'); if(!data.logs)data.logs=[]; let activeTab='workout',timerId=null,audioCtx=null;
function save(){localStorage.setItem(key,JSON.stringify(data))}
function initAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return; if(!audioCtx)audioCtx=new C(); if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function exportBackup(){const payload={app:'Andrea Workout Tracker',version:5,exportedAt:new Date().toISOString(),data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='andrea-workout-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);const incoming=p.data||p;if(!incoming||!Array.isArray(incoming.logs))throw new Error('Invalid backup');if(!confirm('Replace the current workout history with this backup?'))return;data=incoming;if(!data.week)data.week=1;if(!data.day)data.day='A';save();render();alert('Backup restored.');}catch(e){alert('That file does not look like an Andrea Workout Tracker backup.')}};r.readAsText(file)}
function lastFor(ex){let rows=data.logs.filter(x=>x.exercise===ex&&x.weight!==''&&x.weight!=null);return rows.length?rows[rows.length-1]:null}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));document.getElementById('main').innerHTML=activeTab==='workout'?workoutView():activeTab==='stats'?statsView():historyView()}
function workoutView(){let w=workouts[data.day];return `<div class="card hero"><div class="row"><div><div class="tiny">Week ${data.week}</div><div class="workout-title">${w.name}</div></div><select id="daySelect" onchange="data.day=this.value;save();render()"><option value="A" ${data.day==='A'?'selected':''}>Monday • A</option><option value="B" ${data.day==='B'?'selected':''}>Wednesday • B</option><option value="C" ${data.day==='C'?'selected':''}>Friday • C</option></select></div><div style="margin-top:12px" class="small">Most sets: 1–3 RIR • progress reps first, then load.</div></div>`+w.ex.map((e,i)=>{let last=lastFor(e[0]);return `<div class="card exercise"><h3>${e[0]}</h3><div class="small">${e[1]} sets • ${e[2]} reps • ${e[3]}s rest • target ${e[4]} RIR</div>${last?`<div class="prev"><span class="arrow">↻</span><span>Last time: <b>${last.weight} lb</b> × ${last.reps} reps</span><span>• ${new Date(last.date).toLocaleDateString()}</span></div>`:'<div class="prev">No previous entry yet</div>'}<div class="fields"><label>Weight (lb)<input id="wt-${i}" inputmode="decimal" value="${last?.weight??''}"></label><label>Reps<input id="rp-${i}" inputmode="numeric" value="${last?.reps??''}"></label><label>RIR<input id="rir-${i}" inputmode="decimal" value="${last?.rir??e[4]}"></label></div><div class="row" style="margin-top:10px"><button class="primary" onclick="logSet(${i})">Log set</button><button class="secondary" onclick="startTimer(${e[3]})">${e[3]}s rest</button></div></div>`}).join('')+`<div class="card"><div class="row"><div><b>Finish workout</b><div class="small">Counts today toward your weekly and monthly statistics.</div></div><button class="primary" onclick="finishWorkout()">Finish</button></div></div>`}
function logSet(i){let e=workouts[data.day].ex[i],weight=document.getElementById('wt-'+i).value,reps=document.getElementById('rp-'+i).value,rir=document.getElementById('rir-'+i).value;if(!reps){alert('Enter reps first.');return}data.logs.push({date:new Date().toISOString(),week:data.week,day:data.day,exercise:e[0],weight,reps:Number(reps),rir:Number(rir),sets:1,muscles:e[5]});save();render();startTimer(e[3])}
function finishWorkout(){data.logs.push({date:new Date().toISOString(),week:data.week,day:data.day,type:'workout'});save();alert('Workout saved!')}
function startTimer(sec){initAudio();stopTimer(true);localStorage.setItem(timerKey,JSON.stringify({endAt:Date.now()+sec*1000,total:sec}));renderTimer();timerId=setInterval(renderTimer,250)}
function stopTimer(keepHidden=false){if(timerId)clearInterval(timerId);timerId=null;if(!keepHidden)localStorage.removeItem(timerKey);const el=document.getElementById('timer');if(el)el.style.display='none'}
function renderTimer(){const raw=localStorage.getItem(timerKey),el=document.getElementById('timer'),t=document.getElementById('time');if(!raw){if(timerId)clearInterval(timerId);timerId=null;if(el)el.style.display='none';return}let obj;try{obj=JSON.parse(raw)}catch(e){localStorage.removeItem(timerKey);return}let left=Math.max(0,Math.ceil((obj.endAt-Date.now())/1000));if(left<=0){localStorage.removeItem(timerKey);if(timerId)clearInterval(timerId);timerId=null;if(el){el.style.display='block';el.classList.add('done');t.textContent='Done';document.getElementById('timerNote').textContent='Rest complete';}beep();navigator.vibrate?.([180,80,180]);setTimeout(()=>{const e=document.getElementById('timer');if(e)e.style.display='none'},1600);return}if(el){el.classList.remove('done');el.style.display='block';t.textContent=left;document.getElementById('timerNote').textContent='Timer keeps its place if you switch screens.'}}
function beep(){try{initAudio();if(!audioCtx)return;[880,660,880,660,880].forEach((f,i)=>{setTimeout(()=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.22,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.18);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.18)},i*180)});}catch(e){}}
function restoreTimer(){const raw=localStorage.getItem(timerKey);if(!raw)return;renderTimer();if(Date.now()<JSON.parse(raw).endAt)timerId=setInterval(renderTimer,250);else renderTimer()}
function allSetLogs(){return data.logs.filter(x=>x.exercise)}
function stats(){let sets=allSetLogs(),muscle={};sets.forEach(x=>x.muscles?.forEach(m=>muscle[m]=(muscle[m]||0)+1));return {sets,muscle,days:new Set(sets.map(x=>x.date.slice(0,10)))} }
function intensityFor(n,max){if(!n)return 0;let p=n/max;return p>.66?3:p>.33?2:1}
function bodyMap(muscle){let vals=['Shoulders','Chest','Back','Biceps','Triceps','Core','Glutes','Hamstrings','Quads'];let max=Math.max(1,...vals.map(v=>muscle[v]||0));let c=v=>{let n=muscle[v]||0;return n?`fill-opacity="${.18+.72*(n/max)}"`: 'fill-opacity=".08"'};return `<div class="bodymap"><svg viewBox="0 0 360 290" aria-label="Muscle heat map"><g stroke="#7f8793" stroke-width="2" fill="#b5bfd6"><circle cx="180" cy="35" r="22" ${c('Core')}/><path d="M153 62 Q180 50 207 62 L222 112 L207 157 L197 125 L197 205 L187 260 L180 205 L173 260 L163 205 L163 125 L153 157 L138 112 Z" ${c('Core')}/><path d="M154 68 L125 80 L112 128 L124 133 L143 102 Z" ${c('Shoulders')}/><path d="M206 68 L235 80 L248 128 L236 133 L217 102 Z" ${c('Shoulders')}/><path d="M144 74 Q180 61 216 74 L207 112 L180 122 L153 112 Z" ${c('Chest')}/><path d="M156 77 L177 72 L177 117 L153 111 Z" ${c('Back')}/><path d="M204 77 L183 72 L183 117 L207 111 Z" ${c('Back')}/><path d="M126 84 L110 123 L118 158 L130 155 L136 119 Z" ${c('Biceps')}/><path d="M234 84 L250 123 L242 158 L230 155 L224 119 Z" ${c('Triceps')}/><path d="M153 111 L180 121 L207 111 L201 151 L180 160 L159 151 Z" ${c('Core')}/><path d="M159 146 L177 157 L174 206 L157 206 Z" ${c('Glutes')}/><path d="M201 146 L183 157 L186 206 L203 206 Z" ${c('Glutes')}/><path d="M157 202 L174 202 L171 258 L154 258 Z" ${c('Quads')}/><path d="M203 202 L186 202 L189 258 L206 258 Z" ${c('Quads')}/><path d="M154 204 L171 204 L166 258 L151 258 Z" ${c('Hamstrings')}/><path d="M206 204 L189 204 L194 258 L209 258 Z" ${c('Hamstrings')}/></g></svg><div class="body-label bl-shoulder">Shoulders</div><div class="body-label bl-chest">Chest</div><div class="body-label bl-back">Back</div><div class="body-label bl-arms">Arms</div><div class="body-label bl-core">Core</div><div class="body-label bl-glute">Glutes</div><div class="body-label bl-ham">Hamstrings</div><div class="body-label bl-quad">Quads</div></div><div class="body-legend"><span><i class="dot"></i>none</span><span><i class="dot low"></i>low</span><span><i class="dot med"></i>moderate</span><span><i class="dot high"></i>high</span></div>`}
function weeklyCounts(){let now=new Date(),start=new Date(now);start.setDate(now.getDate()-6);let arr=[];for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);let key=d.toISOString().slice(0,10),n=allSetLogs().filter(x=>x.date.slice(0,10)===key).length;arr.push({d,n})}return arr}
function monthly(){let now=new Date(),month=now.getMonth(),year=now.getFullYear(),sets=allSetLogs().filter(x=>{let d=new Date(x.date);return d.getMonth()===month&&d.getFullYear()===year}),days=new Set(sets.map(x=>x.date.slice(0,10))),weights=sets.filter(x=>x.weight!==''),muscle={};sets.forEach(x=>x.muscles?.forEach(m=>muscle[m]=(muscle[m]||0)+1));return {sets,days,weights,muscle}}
function statsView(){let s=stats(),top=Object.entries(s.muscle).sort((a,b)=>b[1]-a[1]),max=Math.max(1,...Object.values(s.muscle)),exercises={};s.sets.forEach(x=>exercises[x.exercise]=(exercises[x.exercise]||0)+1);let main=Object.entries(exercises).sort((a,b)=>b[1]-a[1]).slice(0,7);let prs={};s.sets.forEach(x=>{if(x.weight!==''&&(!prs[x.exercise]||Number(x.weight)>Number(prs[x.exercise].weight)))prs[x.exercise]=x});let pr=Object.values(prs).sort((a,b)=>Number(b.weight)-Number(a.weight)).slice(0,7);let mc=monthly(),week=weeklyCounts(),weekMax=Math.max(1,...week.map(x=>x.n));let daysText=[...s.days].length;return `<div class="card hero"><div class="row"><div><div class="tiny">Progress dashboard</div><div class="workout-title">Statistics</div></div><span class="pill">${s.sets.length} sets logged</span></div><div class="stat-grid" style="margin-top:13px"><div class="stat"><div class="label">WORKOUT DAYS</div><b>${daysText}</b></div><div class="stat"><div class="label">EXERCISES</div><b>${Object.keys(exercises).length}</b></div></div></div>
<div class="section-title">Set count per muscle group</div><div class="card">${top.length?top.map(([m,n])=>`<div class="barrow"><span>${m}</span><div class="bar"><div class="fill" style="width:${n/max*100}%"></div></div><b>${n}</b></div>`).join(''):'<div class="empty">Log a few sets and this will fill in automatically.</div>'}</div>
<div class="section-title">Muscle distribution</div><div class="card"><div class="small">Current training emphasis</div>${bodyMap(s.muscle)}</div>
<div class="section-title">Weekly activity</div><div class="card"><div class="small">Last 7 days • darker = more logged sets</div><div class="week-labels" style="margin-top:11px">${week.map(x=>x.d.toLocaleDateString(undefined,{weekday:'narrow'})).join('').split('').map(x=>`<span>${x}</span>`).join('')}</div><div class="heat">${week.map(x=>`<div class="day ${x.n?('worked'+intensityFor(x.n,weekMax)):''}"><b>${x.n||''}</b><span>${x.d.getDate()}</span></div>`).join('')}</div></div>
<div class="section-title">Main exercises</div><div class="card">${main.length?main.map(([e,n])=>`<div class="report-row"><span>${e}</span><span class="pr-badge">${n} sets</span></div>`).join(''):'<div class="empty">No exercise history yet.</div>'}</div>
<div class="section-title">Leaderboard exercises</div><div class="card">${pr.length?`<table class="table"><thead><tr><th>Exercise</th><th>Best load</th><th>Reps</th></tr></thead><tbody>${pr.map(x=>`<tr><td>${x.exercise}</td><td><b>${x.weight} lb</b></td><td>${x.reps}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Log weighted sets to build your personal leaderboard.</div>'}</div>
<div class="section-title">Monthly report</div><div class="card"><div class="month-header"><div><div class="tiny">${new Date().toLocaleDateString(undefined,{month:'long',year:'numeric'})}</div><div class="month-title">Your training snapshot</div></div><span class="pill">${mc.sets.length} sets</span></div><div class="stat-grid"><div class="stat"><div class="label">WORKOUT DAYS</div><b>${mc.days.size}</b></div><div class="stat"><div class="label">WEIGHTED SETS</div><b>${mc.weights.length}</b></div></div><div class="mini-bars">${week.map(x=>{let h=Math.max(4,Math.round(x.n/weekMax*72));return `<div class="mini-bar"><i style="height:${h}px"></i><span>${x.d.toLocaleDateString(undefined,{weekday:'narrow'})}</span></div>`}).join('')}</div><div class="report-list" style="margin-top:12px"><div class="report-row"><span>Most-trained muscle</span><b>${Object.entries(mc.muscle).sort((a,b)=>b[1]-a[1])[0]?.[0]||'—'}</b></div><div class="report-row"><span>Most-used exercise</span><b>${main[0]?.[0]||'—'}</b></div><div class="report-row"><span>Total logged sets</span><b>${mc.sets.length}</b></div></div><p class="footer-note">Use this as a trend report—not a goal to maximize. The app is designed to help you see consistency and progression while leaving room for recovery.</p></div>`}
function historyView(){let rows=data.logs.filter(x=>x.exercise).slice().reverse().slice(0,50);return `<div class="card hero"><div class="row"><div><div class="tiny">Recent logs</div><div class="workout-title">History</div></div><button class="secondary" onclick="if(confirm('Clear all workout history?')){data.logs=[];save();render()}">Clear</button></div></div><div class="card">${rows.length?`<table class="table"><thead><tr><th>Date</th><th>Exercise</th><th>Load</th><th>Reps</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${new Date(x.date).toLocaleDateString()}</td><td>${x.exercise}</td><td>${x.weight?x.weight+' lb':'—'}</td><td>${x.reps}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No workout history yet.</div>'}</div><div class="section-title">Backup & data</div><div class="card"><div class="row"><div><b>Protect your workout history</b><div class="backup-label">Export a copy before major app updates or device changes.</div></div></div><div class="backup-actions" style="margin-top:12px"><button class="primary" onclick="exportBackup()">Export backup</button><label class="secondary" style="text-align:center;cursor:pointer">Import backup<input type="file" accept="application/json,.json" onchange="importBackup(this.files[0]);this.value=''" style="display:none"></label></div></div><div class="card footer-note">Your previous weight is pulled from the most recent logged set for that exercise, so you can see what you used last time before choosing today's load.</div>`}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render()});render();restoreTimer();document.addEventListener('visibilitychange',()=>{if(!document.hidden){initAudio();restoreTimer()}});window.addEventListener('focus',()=>{initAudio();restoreTimer()});
</script></body></html>
